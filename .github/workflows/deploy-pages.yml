name: Deploy JokboApp to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: JokboApp/package-lock.json

      - name: Install dependencies
        working-directory: JokboApp
        run: npm ci

      - name: Export Web Bundle
        working-directory: JokboApp
        run: |
          npx expo export -p web
          touch dist/.nojekyll

      - name: Deploy to GitHub Pages (gh-pages branch)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./JokboApp/dist
          publish_branch: gh-pages
          force_orphan: true
